<script type="text/plain" id="nc-1">@echo off

set current_path=%~dp0
set cellular_interface="cellular 137"
set cellular_service="DW5826eService"
set adb=%current_path%adb

:menu
echo /*==============================================================================*/
echo /*  1.mbim_info  2.driver_info  3.device_manager  4.at_commands   5.inf_verify  */
echo /* 11.wireshark 12.telephony   13.textanalysis   14.teraterm     15.PEP         */
echo /* 21.sku_set   22.test_set    23.driver_del     24.service      25.ACPI        */
echo /* 31.nettrace  32.driver_log  33.QXDM           34.flash        35.adb         */
echo /* 41.traceview 42.usbview                       88.exit         99.edit        */
echo /*===============================================================v2.0===========*/
set /p choice=select (1-99):

if "%choice%"=="1" goto menu_mbim
if "%choice%"=="2" goto driver_info
if "%choice%"=="3" goto dm_open
if "%choice%"=="4" goto menu_at_commands
if "%choice%"=="5" goto inf_verify
if "%choice%"=="11" goto wireshark_open
if "%choice%"=="12" goto TelephonyTool
if "%choice%"=="13" goto TextAnalysisTool.NET
if "%choice%"=="14" goto teraterm
if "%choice%"=="15" goto menu_pep
if "%choice%"=="21" goto sku_set
if "%choice%"=="22" goto test_set
if "%choice%"=="23" goto menu_driver_del
if "%choice%"=="24" goto menu_service
if "%choice%"=="25" goto menu_acpi
if "%choice%"=="31" goto menu_nettrace
if "%choice%"=="32" goto menu_driver_log
if "%choice%"=="33" goto qxdm
if "%choice%"=="34" goto menu_flash
if "%choice%"=="35" goto menu_adb
if "%choice%"=="41" goto traceview
if "%choice%"=="42" goto usbview
if "%choice%"=="88" goto exit
if "%choice%"=="99" goto edit

echo Input invalid!
pause
goto menu

:menu_at_commands
echo /*==============================================================================*/
echo /* 1.AT*UCOMP=1,1,101F   2.AT*BBOOTHOLD=edl  3.AT*MPCFCCAUTH?  4.AT*BRESET      */
echo /* 9.back                                                                       */
echo /*==============================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto UCOMP
if "%choice%"=="2" goto BBOOTHOLD
if "%choice%"=="3" goto MPCFCCAUTH
if "%choice%"=="4" goto BRESET
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_at_commands

:menu_mbim
echo /*==============================================================================*/
echo /* 1.radio   2.interfaces  3.signal  4.ready_info  9.back                       */
echo /*==============================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto radio
if "%choice%"=="2" goto interfaces
if "%choice%"=="3" goto signal
if "%choice%"=="4" goto ready_info
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_mbim

:menu_nettrace
echo /*==============================================================================*/
echo /* 1.start  2.stop  3.del_registry  9.back                                      */
echo /*==============================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto nettrace_start
if "%choice%"=="2" goto nettrace_stop
if "%choice%"=="3" goto nettrace_delete
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_nettrace

:menu_driver_log
echo /*==============================================================================*/
echo /* 1.start  2.stop  9.back                                                      */
echo /*==============================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto driver_log_start
if "%choice%"=="2" goto driver_log_stop
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_driver_log

:menu_driver_del
echo /*==============================================================================*/
echo /* 1.DW5826_del  2.driver_del  9.back                                           */
echo /*==============================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto DW5826_del
if "%choice%"=="2" goto driver_del
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_driver_del

:menu_service
echo /*==============================================================================*/
echo /* 1.start  2.stop  3.check  4.fw_disable  5.fw_enable  9.back                  */
echo /*==============================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto service_start
if "%choice%"=="2" goto service_stop
if "%choice%"=="3" goto service_check
if "%choice%"=="4" goto fw_disable
if "%choice%"=="5" goto fw_enable
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_service

:menu_flash
echo /*==============================================================================*/
echo /* 1.start  2.check  9.back                                                     */
echo /*==============================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto flash_start
if "%choice%"=="2" goto flash_check
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_flash

:menu_adb
echo /*========================================================================*/
echo /* 1.shell   2.w_disable   3.qbi_log_start  4.qbi_log_stop  5.qbi_log_pull*/
echo /* 6.remount 7.qbi_log_size                                 9.back        */
echo /*========================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto shell
if "%choice%"=="2" goto w_disable
if "%choice%"=="3" goto qbi_log_start
if "%choice%"=="4" goto qbi_log_stop
if "%choice%"=="5" goto qbi_log_pull
if "%choice%"=="6" goto remount_root
if "%choice%"=="7" goto qbi_log_size
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_adb

:menu_acpi
echo /*==============================================================================*/
echo /* 1.dump  9.back                                                               */
echo /*==============================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto acpi_dump
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_acpi

:menu_pep
echo /*==============================================================================*/
echo /* 1.PEP checker  9.back                                                        */
echo /*==============================================================================*/
set /p choice=select (1-9):

if "%choice%"=="1" goto pep_checker
if "%choice%"=="9" goto menu

echo Input invalid!
pause
goto menu_pep

:UCOMP
start "" "%current_path%M2PE_Tool\M2PE_Tool.exe" AT*UCOMP=1,1,101F
goto menu

:BBOOTHOLD
start "" "%current_path%M2PE_Tool\M2PE_Tool.exe" AT*BBOOTHOLD=edl
goto menu

:MPCFCCAUTH
start "" "%current_path%M2PE_Tool\M2PE_Tool.exe" AT*MPCFCCAUTH?
goto menu

:BRESET
start "" "%current_path%M2PE_Tool\M2PE_Tool.exe" AT*BRESET
goto menu

:radio
netsh mbn show radio %cellular_interface%
netsh mbn show connection %cellular_interface%
goto menu

:interfaces
netsh mbn show interfaces
goto menu

:signal
netsh mbn show signal %cellular_interface%
goto menu

:ready_info
netsh mbn show readyinfo %cellular_interface%
goto menu

:nettrace_start
netsh trace start wireless_dbg,provisioning overwrite=yes persist=yes level=5 capture=yes maxSize=0 filemode=single
goto menu

:nettrace_stop
netsh trace stop
goto menu

:nettrace_delete
echo Delete all NetTrace folder under "HKEY_LOCAL_MACHINE\SYSTEM\ControlSet001\Control\WMI\Autologger"
echo HKEY_LOCAL_MACHINE\SYSTEM\ControlSet001\Control\WMI\Autologger | clip
regedit.exe
goto menu

:commands
echo AT*UCOMP=1,1,101F
echo AT*BBOOTHOLD=edl
echo AT*MPCFCCAUTH?
echo AT*BPCINFO?
echo AT*BRESET
goto menu

:sku_set
reg add "HKEY_LOCAL_MACHINE\HARDWARE\DESCRIPTION\System\BIOS" /v "SystemSKU" /t REG_SZ /d "0CB2" /f
goto menu

:test_set
bcdedit /set testsigning on
echo Reboot the machine to enable Testing mode.
pause
goto menu

:driver_info
echo Driver info under "HKEY_LOCAL_MACHINE\SYSTEM\ControlSet001\Enum\USB\VID_413C&PID_8217&MI_XX"
echo HKEY_LOCAL_MACHINE\SYSTEM\ControlSet001\Enum\USB\ | clip
regedit.exe
goto menu

:dm_open
start devmgmt.msc
goto menu

:wireshark_open
echo Add filter parameters "--p=Microsoft-Windows-Wmbclass-Opn"
echo netsh trace convert .\netracelog.etl .\netracelog.txt
echo Get-Content netracelog.txt | Where-Object {$_ -notmatch "No Format Information found"} | Set-Content netracelog_clean.txt
start "" "%current_path%WiresharkPortable64\WiresharkPortable64.exe"
goto menu

:TelephonyTool
start "" "%current_path%TelephonyTool\TelephonyTool.exe"
goto menu

:TextAnalysisTool.NET
start "" "%current_path%TextAnalysisTool.NET\TextAnalysisTool.NET.exe"
goto menu

:teraterm
start "" "C:\Program Files (x86)\teraterm5\ttermpro.exe"
goto menu

:DW5826_del
start "" "C:\Program Files (x86)\Dell Inc\DW5826e\uninstall.exe"
goto menu

:driver_del
start "" "%current_path%DriverStoreExplorer.v0.11.92\Rapr.exe"
goto menu

:driver_log_start
%current_path%\Host_driver_log\"Enable host log.bat"
goto menu

:driver_log_stop
echo Delete all setting
reg delete "HKLM\system\ControlSet001\Control\WMI\Autologger\QNET" /f
reg delete "HKLM\system\ControlSet001\Control\WMI\Autologger\MHI" /f
pause
goto menu

:inf_verify
set directory=%current_path%\infverify
for %%f in ("%directory%\*.inf") do (
  %current_path%infverify\infverif.exe /h /v %%f
)
goto menu

:qxdm
start "" "C:\Program Files\Qualcomm\QXDM5\QXDM.exe" /config "%current_path%\QXDM\Default+QBI.dmc"
goto menu

:service_start
sc start %cellular_service%
goto menu

:service_stop
sc stop %cellular_service%
goto menu

:service_check
sc query %cellular_service% | findstr /i "RUNNING"
if %errorlevel% equ 0 (
  echo %cellular_service% start
) else (
  echo %cellular_service% stop
)
goto menu

:fw_disable
echo "HKEY_LOCAL_MACHINE\SYSTEM\ControlSet001\Control\Palcom\DW5826eService"
reg add "HKEY_LOCAL_MACHINE\SYSTEM\ControlSet001\Control\Palcom\DW5826eService" /v "FWUpdate" /t REG_SZ /d "No" /f
goto menu

:fw_enable
echo "HKEY_LOCAL_MACHINE\SYSTEM\ControlSet001\Control\Palcom\DW5826eService"
reg add "HKEY_LOCAL_MACHINE\SYSTEM\ControlSet001\Control\Palcom\DW5826eService" /v "FWUpdate" /t REG_SZ /d "auto" /f
goto menu

:flash_start
start "" "%current_path%UT_Flash_Tool\ZXL1_ZXL2_FlashTool_V2.0.3.8_4K\Tool\FlashTool.exe"
goto menu

:flash_check
start "" "%current_path%UT_Flash_Tool\ZXL1_ZXL2_FlashTool_V2.0.3.8_4K\UMI\UMI.exe"
goto menu

:shell
start .
start cmd /k "%adb% wait-for-device shell"
goto menu

:remount_root
start .
start cmd /k "%adb% wait-for-device && %adb% shell mount -o remount,rw /dev/root /"
goto menu

:w_disable
%adb% wait-for-device && %adb% shell cat /sys/kernel/debug/gpio && %adb% shell cat /data/persist/rfs/shared/w_disable
goto menu

:qbi_log_start
%adb% wait-for-device && %adb% shell touch /data/mbimd/qbi_enable_logging &&  %adb% shell "printf '\x80\x84\x1E\x00' > /data/mbimd/qbi_enable_logging" && %adb% shell chown radio:radio /data/mbimd/qbi_enable_logging
echo "Reboot module to start logging"
goto menu

:qbi_log_stop
%adb% wait-for-device && %adb% shell rm -rf /data/mbimd/qbi_enable_logging && %adb% shell rm -rf /data/mbimd/qbi_current_log_file.txt && %adb% shell rm -rf /data/mbimd/qbi_previous_file.txt && %adb% shell rm -rf /data/mbimd/*.txt
goto menu

:qbi_log_pull
%adb% wait-for-device && %adb% pull /data/mbimd/qbi_current_log_file.txt %current_path%\log\qbi_current_log_file.txt && %adb% pull /data/mbimd/qbi_previous_log_file.txt %current_path%\log\qbi_previous_log_file.txt && %adb% pull /data/mbimd/qbi_oldest_log_file.txt %current_path%\log\qbi_oldest_log_file.txt
goto menu

:qbi_log_size
echo adb shell "printf '\x80\x84\x1E\x00' ^> /data/mbimd/qbi_enable_logging"
goto menu

:acpi_dump
echo ACPI Dump...
start "ACPI Dump" cmd /k "cd /d "%current_path%iasl-win-20250404\" && del *.dat *.dsl /q && acpidump.exe -b -o acpi_tables.dat && iasl.exe -d *.dat && del *.dat"
goto menu

:pep_checker
echo PEP Checker...
start "PEP Checker" cmd /k "cd /d "%current_path%PEP Checker v2.2.2.3\" && PEPChecker.exe"
goto menu

:traceview
start "" "%current_path%traceview\traceview.exe"
goto menu

:usbview
start "" "%current_path%usbview\usbview.exe"
goto menu

:exit
exit

:edit
notepad "%current_path%_mbn_show.bat"
pause</script>

# MBIM / QBI 架構

## 概述

Qualcomm QBI (Qualcomm MBIM Interface) 實作，橋接主機端 MBIM 協定與數據機端 QMI 介面。
運作於 Linux 使用者空間，透過 USB 與 host 溝通，透過 SMD 與數據機溝通。

## 目錄結構

```
mbim/
├── qbi/
│   ├── framework/   # 核心框架（task、msg、txn、svc、qmi）
│   ├── platform/    # Linux 平台實作
│   ├── svc/         # 21 個 Device Service 實作
│   └── test/        # 單元測試框架
├── qmi_svc/         # QMI IDL 產生的 message 定義
└── wmsts/           # SMS PDU 編解碼工具
```

## 架構分層

```
Host (USB/MBIM)
      │
      ▼
Host Controller Layer    qbi_hc_linux.c
      │
      ▼
Message Layer            qbi_msg.c/.h       MBIM 封包解析/組裝
      │ 建立 qbi_txn_s
      ▼
Task Layer (事件迴圈)    qbi_task.c/.h      單一執行緒
      │
      ▼
Service Dispatch Layer   qbi_svc.c/.h       UUID+CID 路由
      │
   ┌──┴──┐
   ▼     ▼
Device  QMI Layer        qbi_qmi.c / qbi_qmi_txn.c / qbi_qmux.c
Services              │
(svc/)                ▼
                   Modem (QMI/QCCI/SMD)
```

## framework/ 核心模組

| 模組          | 職責                                              |
|---------------|---------------------------------------------------|
| qbi_task      | 主事件迴圈；命令類型：RX_DATA、QMI_RSP、QMI_IND  |
| qbi_msg       | MBIM 協定：OPEN/CLOSE/COMMAND_MSG 解析與回應組裝  |
| qbi_txn       | 交易生命週期管理；每個 MBIM 命令對應一個 qbi_txn_s|
| qbi_svc       | 服務註冊/分派；維護 CID dispatch table            |
| qbi_qmi       | QMI client 管理，透過 QCCI 與數據機通訊           |
| qbi_qmi_txn   | QMI 子交易（掛在父 qbi_txn_s 下）                |
| qbi_qmux      | QMUX 協定層（EXT_QMUX over MBIM）                |

## platform/ (Linux)

| 模組                | 職責                       |
|---------------------|----------------------------|
| qbi_os_linux        | pthread mutex/thread/timer |
| qbi_hc_linux        | USB MBIM 裝置讀寫          |
| qbi_qmux_smd_linux  | SMD 共享記憶體 QMI 傳輸    |
| qbi_nv_store_linux  | 非揮發性儲存（檔案系統）    |
| qbi_fwupd_linux     | 韌體更新                   |
| qbi_log_qxdm        | QXDM 診斷日誌              |

## Device Services（svc/）

每個 service 向框架註冊 qbi_svc_cfg_s：UUID、dispatch_tbl、open/close_fcn、qmi_reg_tbl

| ID | Service   | 說明                          |
|----|-----------|-------------------------------|
|  1 | BC        | Basic Connectivity            |
|  2 | SMS       | SMS 收發                      |
|  3 | USSD      | Unstructured SS Data          |
|  4 | PB        | Phonebook                     |
|  5 | STK       | SIM Toolkit                   |
|  6 | AUTH      | Authentication (AKA/SIM)      |
|  7 | EXT_QMUX  | QMUX over MBIM                |
|  9 | MSHSD     | MS Host Shutdown              |
| 10 | QMBE      | QTI MBIM Extensibility        |
| 11 | MSFWID    | MS Firmware ID                |
| 12 | ATDS      | AT&T Device Services          |
| 13 | QDU       | Qualcomm Device Update        |
| 14 | MSUICC    | MS UICC / SIM                 |
| 15 | BC_EXT    | MS Basic Connectivity Ext.    |
| 16 | MSSAR     | Selective Absorption Rate     |
| 17 | VOICE_EXT | MS Voice Extension            |
| 18 | QIMBE     | QTI Internal MBIMEx           |
| 19 | OOBE      | Out of Box Experience         |
| 20 | CS        | Carrier Subsidy (SIM lock)    |
| 21 | CEIMBE    | Linux AT over MBIM            |

## 資料流

```
MBIM_COMMAND_MSG (host)
  → qbi_msg 解析 → qbi_txn_s
  → qbi_task_cmd_send(RX_DATA)
  → qbi_svc_dispatch → CID handler → qbi_svc_action_e

SEND_QMI_REQ → qbi_qmi 發請求 → 等 QMI_RSP callback
SEND_RSP     → qbi_msg 組 MBIM_COMMAND_DONE → host
```

## Action 狀態機

| Action          | 含義                                       |
|-----------------|--------------------------------------------|
| SEND_QMI_REQ    | 分派 qmi_txns 中的 QMI 請求並等待回應      |
| WAIT_ASYNC_RSP  | 等待非同步回應                             |
| SEND_RSP        | 回應就緒，送給 host                        |
| ABORT           | 錯誤，通知 host 並釋放交易                 |

## qbi_txn_s 核心欄位

```c
typedef struct qbi_txn_struct {
  qbi_ctx_s            *ctx;
  uint32                iid;           // 內部追蹤 ID
  qbi_svc_id_e          svc_id;
  uint32                txn_id;        // MBIM TransactionId
  uint32                cmd_type;      // QUERY / SET / EVENT / INTERNAL
  uint32                cid;
  uint32                status;
  qbi_util_buf_s        req;           // request InformationBuffer
  qbi_util_buf_s        rsp;           // response 固定長度
  qbi_util_buf_chain_s  rsp_databuf;   // response DataBuffer（變長）
  qbi_util_list_s       qmi_txns;      // 子 QMI 交易列表
  uint32                qmi_txns_pending;
  void                 *info;          // 服務自訂狀態
  qbi_os_time_ms_t      timeout;
} qbi_txn_s;
```

## QMI Indication 管理

- **靜態** qbi_svc_ind_reg_static：服務 open 時常駐
- **動態** qbi_svc_ind_reg_dynamic：有時效性，等待特定事件
- **Reference count** qbi_svc_ind_qmi_ref_cnt_*：多個 CID 共享同一 indication 時，
  透過 ref count 決定是否實際向數據機訂閱/取消訂閱

## qmi_svc/ QMI 服務定義（IDL 產生）

QBI 內部 enum (qbi_qmi_svc_e) 與 QMI wire service ID 對照：

| QBI enum ID | 符號           | Wire ID (hex) | Wire ID (dec) | 說明                              |
|-------------|----------------|---------------|---------------|-----------------------------------|
|  0          | DMS            | 0x02          |  2            | Device Management Service         |
|  1          | NAS            | 0x03          |  3            | Network Access Service            |
|  2          | WMS            | 0x05          |  5            | Wireless Messaging Service        |
|  3          | UIM            | 0x0B          | 11            | User Identity Module              |
|  4          | CAT (v2)       | 0x0A          | 10            | Card Application Toolkit v2       |
|  5          | PBM            | 0x0C          | 12            | Phonebook Manager                 |
|  6          | Voice (v2)     | 0x09          |  9            | Voice Service v2                  |
|  7          | WDA            | 0x1A          | 26            | Wireless Data Administrative Svc  |
|  8          | SSCTL          | 0x2B          | 43            | Subsystem Control Service         |
|  9          | DSD            | 0x2A          | 42            | Data System Determination         |
| 10          | PDC            | 0x24          | 36            | Persistent Device Configuration   |
| 11          | SAR            | 0x11          | 17            | Specific Absorption Rate          |
| 12          | TS             | 0x17          | 23            | Thermal Sensor Service            |
| 13 ~ 13+N   | WDS (×sessions)| 0x01          |  1            | Wireless Data Service (多 client) |
| —           | DPM            | 0x2F          | 47            | Data Port Mapper                  |
| —           | CTL            | 0x00          |  0            | QMI Control Service               |

## wmsts/

獨立 SMS PDU 編解碼函式庫，支援 GSM/UMTS（3GPP）與 CDMA（3GPP2），
供 qbi_svc_sms_pdu.c 使用。

---

## 實例：AT over MBIM（QMBE CID 7）

以 AT command 過 MBIM 為範例，說明一個非 QMI 的同步型 CID 如何在框架內實作。

### 位置與 CID 定義

QMBE 服務 (ID 10) 的 CID 7，UUID = `{2d0c12c9-0e6a-495a-915c-8d174fe5d63c}`。
只支援 **Query**，無 Set handler。

```c
// qbi_svc_qmbe_mbim.h
QBI_SVC_QMBE_MBIM_CID_AT_COMMAND = 7   // M2PE tool 使用
```

### 資料結構

```c
// 請求（host → QBI）
typedef PACK(struct) {
  char   at_cmd[256];    // AT 命令字串（不含 \r）
  uint32 at_cmd_len;
} qbi_svc_qmbe_at_command_q_req_s;

// 回應（QBI → host）
typedef PACK(struct) {
  char   at_cmd_rsp[4096]; // modem 原始回應
  uint32 at_cmd_rsp_len;
  char   at_cmd_req[256];  // echo：實際送出的命令（含 \r）
  uint32 at_cmd_req_len;
} qbi_svc_qmbe_at_command_q_rsp_s;
```

### 資料流

```
Host MBIM Query (CID=7)
  ↓
qbi_msg → qbi_txn_s (cmd_type=QUERY)
  ↓
qbi_svc dispatch → qbi_svc_qmbe_at_command_q_req()
  ↓  附加 '\r'，呼叫 qbi_qmbe_smd_write_msg()
open("/dev/smd7") → write(at_cmd) → poll/read 回應 → close
  ↓  action = SEND_RSP（不走 QMI 路徑）
Host MBIM Response (qbi_svc_qmbe_at_command_q_rsp_s)
```

### 與標準 QMI 路徑的對比

| 面向 | 標準 QMI CID（如 BC、NAS） | AT over MBIM（QMBE CID 7） |
|------|---------------------------|---------------------------|
| 後端協定 | QMI (QCCI) | AT over SMD (`/dev/smd7`) |
| 非同步 | 是（SEND_QMI_REQ + callback） | 否（同步阻塞讀取） |
| Action 流程 | SEND_QMI_REQ → callback → SEND_RSP | 直接 SEND_RSP |
| qmi_txns | 有子交易 | 無 |

### Final Response 判斷（`is_final_resp()`）

SMD 讀取在收到下列字串後停止（最多重試 10 次）：

```
尾端比對：OK\r\n  ERROR\r\n  BUSY\r\n  NO ANSWER\r\n  NO CARRIER\r\n  NO DIALTONE\r\n
子字串比對：+CME ERROR:  +CMS ERROR:
```

### Handler 注册

```c
// qbi_svc_qmbe_cmd_hdlr_tbl[]（order 對應 CID 號碼）
,{qbi_svc_qmbe_at_command_q_req, 0, NULL, 0}
//  query_func              min_q_len  set_func  min_s_len
```

注册於 `qbi_svc_qmbe_init()` → `qbi_svc_reg()` 完成掛載。
詳見 `qbi/svc/src/qbi_svc_qmbe.c`。
</script>

# QmuxMdm 驅動架構

## 概述

Qualcomm Windows KMDF 核心驅動套件，在 Windows AP 與 Qualcomm 數據機之間
提供 QMI（Qualcomm MSM Interface）通道。包含三個 .sys 驅動。

## 專案結構

```
QmuxMdm.sln
├── Qmux/            → qcqmux.sys       主驅動 / 上層
├── QmuxUsb/         → qcqmuxusb.sys    USB 傳輸下層 filter
├── QmuxPCIe/        → qcqmuxpcie.sys   PCIe/MHI 傳輸下層 filter
└── QmuxMdmPackage/  → .inf 封裝
```

## 分層架構

```
User/Kernel QMI clients (QCCI or Gobi)
         │  DeviceIoControl IOCTL
         ▼
┌────────────────────────────────────┐
│          qcqmux.sys (Qmux)         │  Function driver
│  - QMI QMUX multiplexer            │  Device: \\.\QMUX\QmuxDevice
│  - 管理多條 RMNET conn_id          │  GUID: 7DCB3244-C836-4A0C
│  - QMI CTL 協定 (sync/ver info)   │
│  - Bus PDO → GNSS / NetAdapter    │
│  - Worker thread 非同步處理        │
└──────────────┬─────────────────────┘
               │ IOCTL_INTERNAL_QMUX_INTERCONNECT_*
               │ 共享 Kernel Event 信號
               ▼
    ┌──────────┴──────────┐
    │                     │
qcqmuxusb.sys       qcqmuxpcie.sys       ← Lower filter（擇一）
(USB 傳輸)           (PCIe/MHI 傳輸)
USB Bulk IN/OUT      pcieio_public API
+ Interrupt pipe     MHI interface
    │                     │
    └──────────┬──────────┘
               ▼
         Qualcomm Modem
```

## Qmux ↔ 傳輸層介面（QmuxPublic.h）

上層 Qmux 透過 Internal IOCTL 控制下層，透過共享 Kernel Event 收資料通知：

| IOCTL | 方向 | 用途 |
|-------|------|------|
| IOCTL_INTERNAL_QMUX_INTERCONNECT_OPEN_PORT  | Qmux → 傳輸 | 開啟，傳入 hReadEvent/hOpenEvent/hCloseEvent |
| IOCTL_INTERNAL_QMUX_INTERCONNECT_CLOSE_PORT | Qmux → 傳輸 | 關閉連線 |
| IOCTL_INTERNAL_QMUX_INTERCONNECT_RX_PEEK    | Qmux → 傳輸 | 查詢是否有資料待讀 |
| hReadEvent / hOpenEvent / hCloseEvent       | 傳輸 → Qmux | signal 通知 |

## Qmux 對外 IOCTL 介面（qmux_common.h）

| IOCTL | 用途 | 用戶端 |
|-------|------|--------|
| IOCTL_QMUX_CLIENT_INIT              | 初始化 client               | QCCI / Gobi |
| IOCTL_QMUX_TX_MSG                   | 傳 QMI 訊息到數據機         | QCCI / Gobi |
| IOCTL_QMUX_RX_MSG                   | 從數據機收 QMI 訊息         | QCCI / Gobi |
| IOCTL_QMUX_CLIENT_RELEASE           | 釋放 client                 | QCCI / Gobi |
| IOCTL_QMUX_ALLOC_CLIENT_ID          | 申請 QMI client ID          | Gobi only   |
| IOCTL_QMUX_QMI_GET_MEID             | 取得 MEID                   | Gobi only   |
| IOCTL_QMUX_QMI_GET_SVC_VER[_EX]    | 取得 service 版本           | Gobi only   |
| IOCTL_QMUX_QMI_CTL_SET_DATA_FORMAT  | 設 QoS / link layer 格式   | —           |
| IOCTL_QMUX_READ_OOB                 | 讀 OOB 事件（server 上下線）| —           |

## QMI Connection ID（RMNET 通道）

qmi_connection_id_type 定義多條虛擬 QMI 通道：

| 範圍                          | 對應 SMD/SDIO 通道          |
|-------------------------------|-----------------------------|
| RMNET_0 ~ 8                   | SMD DATA5 ~ DATA16_CNTL     |
| SIO_PORT_SDIO_MUX_A2_REV_IP_0~8 | SMD DATA23 ~ DATA31_CNTL |
| RMNET_SDIO_0 ~ 7             | SDIO0 ~ SDIO7_CNTL          |
| RMNET_12, 13, PROXY           | 額外通道                    |

## 關鍵資料結構

| 結構                    | 檔案               | 用途                                          |
|-------------------------|--------------------|-----------------------------------------------|
| QMUX_DEVICE_CONTEXT     | qmux.h             | 主驅動裝置實例：連線、queue、client list、MHI |
| CLIENT_CONTEXT          | qmux.h             | 每個 file handle 的 read/write/OOB queue      |
| QmuxClientInfo          | qmux.h             | service_id、client_id、版本、QCCI/Gobi 類型   |
| InterconnectIoTargetInfo| qmux.h             | 每條 conn_id 的 IoTarget 及 rx buffer         |
| USB_CONTEXT             | UsbOperations.h    | USB pipes、read packet pool（8 × 8KB）        |
| QMUXPCIE_DEVICE_CONTEXT | QmuxPCIe/Device.h  | PCIe IO request pool（8 × 8KB）、pcieio ctx   |

## INF 安裝邏輯

### USB 路徑
- 匹配：USB\VID_05C6&PID_9085&MI_04 或 USB\VID_05C6&PID_90E2&MI_02
- qcqmuxusb.sys → LowerFilters
- qcqmux.sys → Associated Service（function driver）

### PCIe 路徑
- 匹配：{3a4d657c-0a42-4501-9627-ba1b76ffc39d}\QcQmux_OEM_MUST_CHANGE_THIS
- qcqmuxpcie.sys → LowerFilters
- qcqmux.sys → Associated Service

### Bus PDO
- GUID: {7DCB3244-C836-4A0C-A1E9-BD68D385AA2B}
- 子裝置：GNSS PDO、NetAdapter PDO（OEM 需設定）

## Client 類型

| 類型 | 說明 |
|------|------|
| QCCI | 標準 QMI QCCI 客戶端（現代路徑）|
| Gobi | 舊式 Gobi 驅動客戶端（legacy，需 ALLOC_CLIENT_ID 等額外 IOCTL）|

## 執行緒架構

`QMUX_DEVICE_CONTEXT` 中維護多條執行緒：

| 執行緒 | 觸發方式 | 用途 |
|--------|----------|------|
| pManualQueueThread | 啟動時建立 | 處理 ManualQueue 中的 Read 請求 |
| pWorkItemWorkerThread | 啟動時建立 | 非同步 Work Item 執行（GetClientID / GetMEID / SetDataFormat 等）|
| ThreadObjects[conn_id] | 每條 conn_id 各一條 | QmuxReadRequestThread：從傳輸層 RX、分發給 client |
| hThreadTerminationEvent | KEVENT | D0 Exit / 裝置移除時廣播，通知所有執行緒結束 |

QmuxRxThreadEvent / QcciRxThreadEvent 兩個 KEVENT 分別喚醒對應接收執行緒。

## 電源管理

- WDF Directed Power Transition 已啟用（`WdfDirectedPowerTransitionEnable = 1`）
- USB 路徑：Selective Suspend timeout = **5 秒**
- PCIe 路徑：Suspend timeout = **10 ms**
- S0 wake 透過 `QMUX_INTERCONNECT_POWER_INTERFACE` 介面向下層 filter 取得 arm/disarm callback：
  ```c
  typedef struct _QMUX_INTERCONNECT_POWER_INTERFACE {
      INTERFACE Header;
      PFN_WDF_DEVICE_ARM_WAKE_FROM_S0     QmuxIcPwrEvtArmWakeFromS0;
      PFN_WDF_DEVICE_DISARM_WAKE_FROM_S0  QmuxIcPwrEvtDisarmWakeFromS0;
  } QMUX_INTERCONNECT_POWER_INTERFACE;
  ```
- 子裝置（GNSS / QNet）可透過 `IOCTL_INTERNAL_QMUX_BUS_REQ_WAKE_GNSS` /
  `IOCTL_INTERNAL_QMUX_BUS_REQ_WAKE_QNET` 請求 Wait Wake IRP

## SSR（Subsystem Restart）

- `QMUX_DEVICE_CONTEXT.ssrInProgress` 旗標標記數據機重啟中
- `hSSREvent` KEVENT 通知 SSR 完成
- SSR 期間 Qmux 需暫停 TX、等待重連後重新執行 CTL Sync + GetVersionInfo 流程

## 對外裝置介面 GUID

| GUID | 名稱 | 用途 |
|------|------|------|
| 7714fa50-… | GUID_DEVINTERFACE_QMUXINTERCONNECT | 下層 filter 暴露給 qcqmux 的介面 |
| 6064DC13-… | GUID_DEVINTERFACE_EXT_QMUX | 外部（user-mode）QMUX 介面 |
| CDC35B6E-… | GUID_DEVINTERFACE_SERVICE | QMI service 層介面 |

MBIM 全域事件（ExtQmuxInterfaces.h）：
- `\\GLOBAL??\MBIMArrivalEvent`
- `\\GLOBAL??\MBIMRemovalEvent`
- `\\GLOBAL??\MBIMDataReadyEvent`

## Extension INF（QmuxMdmExtension.inx）

獨立的 Extension INF，ExtensionID = `{5A9A19C3-847D-400B-89FC-758F3037CA27}`：
- 匹配相同的 USB VID/PID 與 PCIe 裝置
- 新增友善名稱 "Qualcomm QMUX Interconnect with Services"
- 建立 Software Component：`qcwifinotifiersrvc`（WiFi 通知服務）

# atfwd-daemon 架構

## 概述

Android Linux 使用者空間常駐程式，向 QMI ATCOP 服務註冊，
攔截來自數據機的 AT 命令並在本地處理或轉發給外部客戶端。

## 整體架構

```
Modem（QMI ATCOP Service）
      │  QMI indication（AT 命令）
      ▼
┌─────────────────────────────────────────┐
│            atfwd-daemon                  │
│                                         │
│  QMI 層          →  ds_cmdq            │
│  (indication cb)     (事件佇列)          │
│                       │                 │
│               atfwd_cb_cmd_exec()       │
│                       │                 │
│           atfwd_process_new_request()   │
│                       │                 │
│      ┌────────────────┼──────────────┐  │
│      ▼                ▼              ▼  │
│  inline handler  CmdHandle_lookup  forward│
│  (+CFUN,*B*等)  (handler table)  to client│
└───────────────────────────────────────┬─┘
                                        │ UNIX domain socket / NetLink
                                        ▼
                              外部 AT 客戶端（最多 20 個）
```

## 模組說明

| 檔案 | 功能 |
|------|------|
| atfwd_daemon.c        | 主程式：QMI 初始化、AT 命令註冊、事件調度 |
| atfwd_cmdhandle.c     | 函式指標 handler table；CmdHandle_lookup() 路由 |
| atfwd_customcmd_handle.c | 簡單 set/get 型命令，NV 存取模式 |
| atfwd_unix.c          | UNIX domain socket + NetLink socket 通訊層 |
| atfwd_mtdop.c         | MTD/NAND flash 讀寫（韌體更新、image 操作）|
| impref_pri.c          | IM 偏好（*BIMPREF）優先級管理 |
| supl_event.c          | SUPL 定位事件（suplstart / suplreply / suplend）|

## main() 啟動流程

```
main()
  ├── Diag_LSM_Init()                      # 診斷日誌
  ├── atfwd_signal_init()                  # SIGINT/SIGTERM
  ├── atfwd_cmdq_init()                    # ds_cmdq 事件佇列
  ├── atfwd_dll_init()                     # pending indication 鏈結串列
  ├── at_get_service_object_v01()          # QMI AT service object
  ├── atfwd_reg_for_service_up_event()     # 等待 modem UP
  ├── atfwd_unix_netlink_init()            # NetLink 事件 socket
  ├── hwidTorfs()                          # HWID 寫入 RFS
  ├── lwm2mDebugStart(true)               # LwM2M debug 執行緒
  └── atfwd_unix_listener_init()           # UNIX socket 監聽（主迴圈）
```

## 事件處理流程

### QMI Modem UP
```
atfwd_sys_up_cb()
  → cmdq enqueue(ATFWD_UP_EV)
  → atfwd_qmi_client_init()              # qmi_client_init_instance
  → atfwd_register_legacy_at_commands()  # 向 ATCOP 註冊 82 條命令
  → atfwd_unix_send_event(DS_AT_UP_EV)   # 通知所有客戶端
```

### AT 命令收到
```
qmi_at_unsol_ind_cb()
  → cmdq enqueue(ATFWD_CMD_IND_EV)
  → atfwd_process_new_request()
      ├── 1. inline handler（+CFUN, *BPHASEID 等硬編碼）
      ├── 2. CmdHandle_lookup(name) → atcmd_handler()
      ├── 3. custom_CmdHandle_lookup(name) → Custom_AtCmdHandle()
      └── 4. 無 handler → 轉發給外部 client（dll + UNIX msg）
```

## AT 命令分發優先順序

```
1. inline if/else（atfwd_process_new_request 內硬編碼，legacy + *B* 系列）
2. CmdHandle_lookup()        → atfwd_cmdhandle.c handler table
3. custom_CmdHandle_lookup() → atfwd_customcmd_handle.c set/get table
4. 轉發給 UNIX 客戶端（pending dll + netlink 通知）
```

## 主要 AT 命令分類（共 82 條）

| 前綴 | 範例 | 說明 |
|------|------|------|
| 標準 | +CFUN, $QCPWRDN         | 功能/電源 |
| *U*  | *UCOMP, *USPEED, *UPID  | USB 組態 |
| *B*  | *BRESET, *BBOOTHOLD, *BFWVER, *BIMAGE, *BIMPREF | Boot/韌體 |
| *PC* | *PCTEMP, *PCVOLT        | 電源/溫度監控 |
| *GPS*| *GPSELNA, *GPSCONF      | GPS 設定 |
| AT!  | AT!FLOG, AT!ERR, AT!CHKSB | 診斷/debug |
| LwM2M| *LWM2M, *LWM2MURL      | LwM2M IoT 管理 |
| SAR  | *SARDEFAULTSTATE, *SARINDEX | SAR 設定 |
| SUPL | *SUPLSTART, *SUPLREPLY  | SUPL 定位 |

## customcmd_handle 模式

適用於 NV 讀寫型命令，統一 set/get pattern：

```c
typedef struct {
    char atcmd[65];
    atcmd_set_handler  set_fcn;   // AT cmd=<value>
    atcmd_get_handler  get_fcn;   // AT cmd?
    char valid_values[5];         // 合法值範圍
} atfwd_customcmd_handler;
```

命令：WakeUpHostEN、SingleApnSwitch、FastEnum、USBSerialEn、
      GPSSel/Enable/LPM、ProviderNameFmt、MbimType、GpioTunerEnable

## 通訊介面

| 介面 | 用途 |
|------|------|
| QMI ATCOP（qmi_client）| 從數據機收 AT 命令；回傳 response |
| QMI DMS               | 取得裝置資訊（序號等）|
| NetLink socket        | 向客戶端推送 UP/DOWN/CMD 非同步事件 |
| UNIX domain socket    | 雙向：接收客戶端 AT 請求 + 回傳 response |

# AT over MBIM — QBI 實現

## 概述

QBI (Qualcomm MBIM Interface) 透過 **QMBE** (Qualcomm Mobile Broadband MBIM Extensibility)
裝置服務的 **CID 7** 提供 AT over MBIM 功能，主要供 **M2PE 工具**使用。

AT 命令由 host 透過 MBIM Query 送入，QBI 將其轉發至 modem 的 SMD 通道 (`/dev/smd7`)，
讀回 AT 回應後透過 MBIM Response 回傳 host。

---

## 服務識別

| 屬性 | 值 |
|------|-----|
| 服務 | QMBE (Qualcomm MB MBIM Extensibility) |
| UUID | `{2d0c12c9-0e6a-495a-915c-8d174fe5d63c}` |
| CID  | **7** (`QBI_SVC_QMBE_MBIM_CID_AT_COMMAND`) |
| 操作 | Query only（無 Set handler） |

QMBE CID 清單（`qbi_svc_qmbe_mbim.h`）：

```c
QBI_SVC_QMBE_MBIM_CID_DIAG_CONFIG  = 1
QBI_SVC_QMBE_MBIM_CID_DIAG_DATA    = 2
QBI_SVC_QMBE_MBIM_CID_DEVICE_LOG   = 3
QBI_SVC_QMBE_MBIM_CID_SIMLOCK      = 4
// 5, 6 未定義
QBI_SVC_QMBE_MBIM_CID_AT_COMMAND   = 7   ← AT over MBIM
```

---

## 資料結構（`qbi_svc_qmbe_mbim.h`）

```c
/* Host → QBI: AT 命令請求 */
typedef PACK(struct) {
  char   at_cmd[256];    // AT 命令字串（不含 \r）
  uint32 at_cmd_len;     // 字串長度
} qbi_svc_qmbe_at_command_q_req_s;

/* QBI → Host: AT 命令回應 */
typedef PACK(struct) {
  char   at_cmd_rsp[4096]; // modem 回傳的原始 AT 回應
  uint32 at_cmd_rsp_len;
  char   at_cmd_req[256];  // echo：QBI 實際送出的命令（含 \r）
  uint32 at_cmd_req_len;
} qbi_svc_qmbe_at_command_q_rsp_s;
```

---

## 資料流

```
Host (M2PE Tool)
  │  MBIM_COMMAND_MSG (type=Query, CID=7)
  │  InformationBuffer = qbi_svc_qmbe_at_command_q_req_s
  ▼
USB/PCIe Transport
  ▼
qbi_msg.c → qbi_svc.c  (框架路由)
  ▼
qbi_svc_qmbe_at_command_q_req()   [qbi_svc_qmbe.c:1099]
  │  1. 從 txn->req.data 取出 at_cmd
  │  2. 在末尾附加 '\r'
  │  3. 呼叫 qbi_qmbe_smd_write_msg()
  ▼
qbi_qmbe_smd_write_msg()          [qbi_svc_qmbe.c:985]
  │  open("/dev/smd7", O_RDWR | O_NOCTTY | O_NDELAY)
  │  write(fd, at_cmd, len)
  │  poll/select 讀回回應（最多 10 次重試）
  │  close(fd)
  ▼
Modem ATCOP (SMD channel 7)
  │  AT 命令處理
  ▼
/dev/smd7 (read back)
  ▼
qbi_svc_qmbe_at_command_q_req()
  │  action = QBI_SVC_ACTION_SEND_RSP
  ▼
Host：MBIM_COMMAND_DONE (含 qbi_svc_qmbe_at_command_q_rsp_s)
```

---

## SMD 讀取細節（`qbi_qmbe_smd_write_msg`）

- 裝置檔：`/dev/smd7`
- 最大重試：`QBI_QMBE_SMD_MAX_RETRY_COUNT = 10`
- 有兩種讀取模式（編譯期選擇）：
  - `#ifdef ATCLI_V3`：使用 `select()` + 300 ms timeout per iteration
  - 否則：使用 `poll(POLLIN | POLLPRI | POLLERR, timeout=-1)`

---

## Final Response 判斷（`is_final_resp()`）

收到回應後持續累積，直到符合下列 **結尾字串** 或 **內含特殊字串** 才停止讀取：

**正常 final response（尾端比對）：**
```
OK\r\n  ERROR\r\n  BUSY\r\n  NO ANSWER\r\n  NO CARRIER\r\n  NO DIALTONE\r\n
```

**特殊 final response（子字串比對）：**
```
+CME ERROR:   +CMS ERROR:
```

---

## 關鍵原始檔

| 檔案 | 說明 |
|------|------|

# qmuxbridge 架構

## 概述

Android 使用者空間常駐程式（`qmuxbridge`），在 Android 裝置上充當 QMUX 透明中繼橋接，
將 Host（Windows/Linux）透過 USB 傳來的原始 QMUX 封包轉送到 Modem SMD 通道，
反方向亦同，讓 Host 可直接對 Modem 發送 QMI 訊息。

```
Host (Windows/Linux)
      │  原始 QMUX 封包
      ▼
  /dev/gps  ← USB Gadget (GSI)
      │
  qmuxbridge daemon (Android AP)
      │
  /dev/smdcntl1  ← SMD 控制通道
      │
  Qualcomm Modem
```

## 原始碼模組

| 檔案 | 功能 |
|------|------|
| `qbridge_main.c` | `main()`：初始化、執行緒啟動、狀態機、SMD write |
| `qbridge_smd.c`  | SMD 端口 open/close、SMD RX 執行緒（`/dev/smdcntl1`）|
| `qbridge_usb.c`  | USB 監控執行緒、UEvent 執行緒（`/dev/gps`）|
| `qbridge_dpm.c`  | QMI DPM 開/關端口、EP lookup IOCTL |
| `qbridge_qmi.c`  | QMI WDA 客戶端初始化，SSR 偵測 error callback |
| `qbridge_qmux.h` | QMUX 封包結構定義（if_type / hdr / SDU）|
| `qbridge_log_qxdm.c` | QXDM/Diag 日誌 |
| `qbridge_log_file.c` | 檔案日誌 |

## 執行緒架構（3 執行緒）

```
main()
├── qbridge_qmux_smd_init()   → SMD RX Thread (rx_th_id)
├── qbridge_start_usb_moniter_thread()    → USB Monitor Thread
└── qbridge_start_usb_uevent_moniter_thread() → USB UEvent Thread
```

### SMD RX Thread（`rx_th_id`）
- 阻塞 `poll()` + `read()` 在 `/dev/smdcntl1`
- 收到資料 → `qbridge_send_msg_to_host()` → `write(/dev/gps)` 送給 Host
- USB 未連線時等待 `usb_monitor_semaphore`
- 收到 SSR 錯誤（ENETRESET / ECONNRESET）→ 跳出迴圈，執行緒結束

### USB Monitor Thread（`usb_monitor_thread_id`）
- 阻塞 `poll()` + `read()` 在 `/dev/gps`
- 收到 **0 位元組** 封包 → 觸發 `ioctl(GSI_MBIM_GPS_USB_STATUS)` 查詢 USB line state
  - USB 斷線 → 關閉 fd，等待 `usb_uevent_cmd_cond`
  - USB 連線 → 呼叫 `qbridge_dpm_open()`，發送 `sem_post` 通知 SMD 執行緒
- 收到 **非零** 封包（Host 傳來的 QMUX msg）→ `qbridge_qmux_smd_wait()` → `write(/dev/smdcntl1)`

### USB UEvent Thread（`usb_uevent_monitor_thread_id`）
- 開啟 `NETLINK_KOBJECT_UEVENT` netlink socket
- 啟動時先讀 `/sys/devices/virtual/gsi_usb/gps/uevent` 取得初始狀態（避免錯過 boot 事件）
- 解析 uevent 字串：`STATE=connected` / `STATE=configured` / `STATE=disconnected`
- USB 變成 CONNECTED → `pthread_cond_signal(usb_uevent_cmd_cond)` 喚醒 USB Monitor Thread

## 執行緒同步

| 機制 | 方向 | 用途 |
|------|------|------|
| `usb_monitor_semaphore` (sem_t) | UEvent → SMD 執行緒 | USB connected，通知 SMD 可以開始 open SMD 並收資料 |
| `usb_uevent_cmd_cond` + mutex   | UEvent → USB Monitor | USB connected，喚醒等待中的 USB Monitor |

## 狀態機

### qbridge_state_e
```
OPENING(1) → OPENED(2)   （SMD init + QMI init 成功）
OPENED(2)  → OPENING(1)  （USB fd 關閉）
OPENING(1) → CLOSED(0)   → re-init（SSR 完成後自動重試）
```

### qbridge_usb_state_e
```
INVALID(-1) → DISCONNECTED(0) → CONNECTED(1)
```

## DPM（Data Port Mapper）

使用 QMI DPM 服務通知 Modem 哪條控制通道與哪個 EP（Endpoint）對應：

1. EP lookup：`ioctl(/dev/gps, EP_LOOKUP)` → 取得 `hardware_accl_port_details_v01`
2. 開端口：`QMI_DPM_OPEN_PORT_REQ_V01`，控制端口 = `DATA6_CNTL`，EP info 由 lookup 提供
3. 關端口：`QMI_DPM_CLOSE_PORT_REQ_V01`（USB 斷線或 SSR 時）

## SSR（Subsystem Restart）處理

```
Modem restart
    → qbridge_qmi_client_error_cb (QMI_SERVICE_ERR)
    → ssr_in_progress = TRUE
    → qbridge_close_interface_towards_modem()
        → qbridge_dpm_close()
        → qbridge_qmux_smd_close()
        → state = CLOSED
        → qbridge_dpm_open()        ← 重新開 DPM
        → qbridge_initialize_modem_interface()  ← 重新 init SMD + QMI
```

## QMUX 封包結構（qbridge_qmux.h）

```
[if_type: 1B]
[QMUX HDR: length(2) + ctl_flags(1) + svc_type(1) + client_id(1)]
[SDU (非 CTL): svc_ctl_flags(1) + txn_id(2)]
  或
[QMI_CTL SDU:  svc_ctl_flags(1) + txn_id(1)]
[QMI Msg: msg_id(2) + msg_length(2)]
[TLV data ...]
```

## 裝置節點

| 節點 | 方向 | 用途 |
|------|------|------|
| `/dev/gps` | Host ↔ AP | USB Gadget 端（`usb_ctrl_qti.h`）|
| `/dev/smdcntl1` | AP ↔ Modem | SMD 控制通道 |
| `/sys/devices/virtual/gsi_usb/gps/uevent` | 讀取 | 開機時查詢初始 USB 狀態 |

## 建置（Android.mk）

- 輸出：`qmuxbridge`（可執行檔）
- 關鍵依賴：`libqmi_cci`、`libqmi_client_qmux`、`libqmiservices`、`libdiag`、`librmnetctl`
- `qbridge_qmi.c` 未列入 `LOCAL_SRC_FILES`（僅 header 被引用，實際 QMI init 在 main 呼叫）
</script>

<script type="text/plain" id="nc-19">
## 整體流程

```
kernel 偵測到裝置
       │
       ▼
udevd (daemon) 收到 uevent
       │
       ▼
掃描 /etc/udev/rules.d/*.rules
       │
  條件匹配
       │
       ▼
執行 RUN+= 指定的 script / 設定權限 / 建立 symlink
```

udev 是 userspace 的裝置管理器，kernel 每次新增/移除裝置節點時，會透過 netlink socket 送出 uevent，`udevd` 接收後根據 rules 決定要做什麼。

---

## Rules 檔解析（`data_udev_rules.rules`）

Rules 放在 `/etc/udev/rules.d/`，檔名決定載入順序（數字越小越早）。

```
KERNEL=="ttyGS0", RUN+="/etc/udev/scripts/data_udev_script.sh ttyGS0"
```

| 欄位 | 意義 |
|------|------|
| `KERNEL==` | 比對 kernel 裝置名稱（`/sys` 裡的名稱） |
| `SUBSYSTEM==` | 比對子系統（如 `mtd`、`net`） |
| `ATTR{name}==` | 比對 sysfs attribute 值 |
| `RUN+=` | 裝置出現後執行的命令（在 udevd 的 worker process 裡同步執行） |
| `TAG+="systemd"` | 告訴 systemd 這個裝置需要被追蹤（`rndis0` 有用到） |

監控的裝置類型：

- **ttyGS0/1** — USB Gadget Serial（USB device mode 的虛擬串口）
- **ttyHS1** — High-Speed UART
- **smd7~10** — Shared Memory Driver（AP ↔ modem IPC 通道）
- **mhi_pipe_14/16, mhi_ctrl** — MHI（Modem Host Interface，PCIe-based modem 通道）
- **dpl_ctrl** — Data Path Logging 控制介面
- **smdcntl8, rmnet_ctrl** — RMNET 控制通道
- **bridge\*** — Linux bridge 虛擬網卡（QCMAP 用）
- **gsb** — General Segmentation Bridge
- **rndis0** — USB RNDIS 網路介面
- **mtd emac** — EMAC MAC address 儲存在 MTD partition
- **switch_ssdk** — SSDK Ethernet switch 控制節點

---

## Script 做的事（`data_udev_script.sh`）

Script 收到裝置名稱作為 `$1`，主要做三件事：

**1. `chown radio:radio /dev/<node>`**
大多數 modem/data 相關裝置都改成 `radio` user/group，讓 `qcrilhald`、`data-ipa-cfg-mgr` 等 radio group 的 service 能存取，不需要 root。

**2. `chmod` 部分節點**
`smd8` 額外設 `664`，`switch_ssdk` 設 `660`。

**3. 特殊邏輯**

```sh
rndis)
    ifconfig rndis0 up
    brctl addif bridge0 rndis0   # 把 rndis0 加入 QCMAP 的 bridge0
;;

mtd)
    chown radio:radio /dev/$2
    ln -sf /dev/$2 /tmp/data/early_eth_partition_file  # 給 EMAC 讀 MAC addr
    chcon system_u:object_r:datamtd_device_t:s0 /dev/$2  # SELinux label
;;
```

`rndis` 的處理比較特別：USB 接上 host 時 rndis0 出現，script 直接把它橋接進 `bridge0`，讓 QCMAP 的 NAT/routing 立刻生效，不需要另一個 service 監聽。

---

## Poky/Yocto 部署方式

```bitbake
SRC_URI += "file://data_udev_rules.rules \
            file://data_udev_script.sh"

do_install() {
    install -d ${D}${sysconfdir}/udev/rules.d
    install -m 0644 ${WORKDIR}/data_udev_rules.rules \
        ${D}${sysconfdir}/udev/rules.d/

    install -d ${D}${sysconfdir}/udev/scripts
    install -m 0755 ${WORKDIR}/data_udev_script.sh \
        ${D}${sysconfdir}/udev/scripts/
}
```

---

## 注意事項

1. **`RUN+=` 是同步的**：udevd worker 會等 script 結束才繼續，script 不能 block 太久。
2. **`mhi_pipe_14` 重複定義**：script 裡 case `mhi_pipe_14` 出現兩次（第 37 行和第 55 行），後者覆蓋前者，功能相同，但屬於 dead code。
3. **`TAG+="systemd"`（rndis0）**：讓 systemd 可以用 `BindsTo=sys-subsystem-net-devices-rndis0.device` 之類的 unit dependency 等待裝置；其他裝置靠 udev event 觸發 script 就夠了。
4. **`/dev/kmsg` 當 log**：script 用 `echo > /dev/kmsg` 寫 kernel message buffer，開機期間 logd 還沒起來時最可靠的 debug 方式。

---

## 實例：smd7 rule 有時未觸發

`/dev/smd7` owner 沒被設成 `radio:radio`，下游 service 存取失敗。常見原因與排查：

### 原因一：開機時序（最常見）

`udevd` 啟動時間可能晚於 smd7 節點出現，early event 若沒有 coldplug replay 就漏掉。

```bash
udevadm monitor --kernel --udev &
udevadm trigger --action=add /sys/devices/.../smd7
```

Workaround：在 data service 啟動前補 fallback：
```sh
[ -e /dev/smd7 ] && [ "$(stat -c %U /dev/smd7)" != "radio" ] && \
    chown radio:radio /dev/smd7
```

### 原因二：SSR 後 event 類型不是 `add`

Modem SSR 後 smd channels 重建，driver 可能送 `change` 而非 `add`，但 `RUN+=` 預設只對 `add` 觸發。

```bash
udevadm monitor --kernel 2>&1 | grep smd7   # 確認 ACTION=
```

Fix：rules 加上 ACTION 匹配：
```
KERNEL=="smd7", ACTION=="add|change", RUN+="/etc/udev/scripts/data_udev_script.sh smd7"
```

### 原因三：Rules 缺逗號

`smd7` 那行缺逗號，舊版 udevd 可能解析異常（其他行如 `smd10` 有逗號）。補上後執行 `udevadm control --reload`。

### 原因四：udevd worker 被 block

其他裝置 script 卡住（如 `brctl addif`）導致 worker pool 滿，後續 event 被 delay 或 drop。

```bash
journalctl -u systemd-udevd | grep -iE "worker|timeout|killed"
```

### 原因五：SMD channel 本身沒 probe

modem 側 service 未起來，`/dev/smd7` 根本不會建立，這是 modem 問題而非 udev 問題。

```bash
ls -la /dev/smd*
dmesg | grep smd7
cat /sys/kernel/debug/msm_smd/ch7
```

### Debug 決策樹

```
/dev/smd7 owner 不是 radio？
        │
        ├─ 節點不存在 → modem 沒 probe，看 dmesg
        │
        └─ 存在但 owner 錯誤
                │
                ├─ udevadm monitor 看 ACTION
                │       ├─ 沒收到 event → 時序問題，補 coldplug
                │       └─ 收到 change  → rules 加 ACTION=="add|change"
                │
                ├─ journalctl udevd 有 worker timeout → 找卡住的 script
                ├─ rules 缺逗號 → 補逗號後 reload
                └─ 只有 SSR 後才壞 → ACTION 類型問題
```
</script>

## 安裝

### 前置需求：Node.js ≥ 18

WSL Ubuntu 預設的 apt 版本太舊，建議用 NodeSource 安裝：

```bash
curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
sudo apt install -y nodejs
node -v   # 確認 ≥ 18
```

或用 nvm（不需要 sudo，版本可隨意切換）：
```bash
curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
source ~/.bashrc
nvm install --lts
```

### 安裝 Claude CLI

```bash
npm install -g @anthropic-ai/claude-code
claude --version
```

### 首次登入

```bash
claude
# 瀏覽器跳出 Anthropic 登入頁，完成後 token 存在 ~/.claude.json
```

如果 WSL 沒有辦法自動開瀏覽器：
```bash
claude auth login
# 複製終端機顯示的 URL，貼到 Windows 瀏覽器手動開啟
```

---

## 常見問題

| 問題 | 原因 | 解法 |
|------|------|------|
| `EACCES` 安裝失敗 | npm global 目錄權限問題 | 改用 nvm，或 `npm config set prefix ~/.local` |
| 登入後仍說未授權 | WSL 時間偏差造成 token 失效 | `sudo hwclock -s` 同步時鐘 |
| 無法自動開瀏覽器 | WSL 沒有 `xdg-open` 連結 | 手動複製 URL 到 Windows 瀏覽器 |
| `ENOMEM` 大型 repo | WSL2 預設記憶體限制 2 GB | `~/.wslconfig` 加 `memory=8GB` |
| proxy 環境無法連線 | 需設 HTTPS_PROXY | `export HTTPS_PROXY=http://proxy:port` |

---

## 使用技巧

### `!` 前綴：在對話中直接執行 shell 指令

在 claude prompt 輸入 `! <command>`，指令會在當前 session 執行，輸出直接進入對話：
```
> ! git log --oneline -5
> ! adb devices
> ! cat build.log | tail -50
```
適合讓 Claude 看到即時的指令輸出再繼續分析，不需要複製貼上。

### CLAUDE.md：專案級別的持久指令

在專案根目錄放 `CLAUDE.md`，Claude 每次進入該目錄都會自動讀取：
- 描述 build 指令、專案架構、命名慣例
- 設定「永遠不要做 X」的限制
- 用 `/init` 讓 Claude 自動分析 codebase 產生初稿

```bash
claude /init        # 分析當前目錄並產生 CLAUDE.md
```

### Memory 系統：跨 session 記憶

Claude 會自動把重要資訊存進 `~/.claude/projects/<path>/memory/`，未來 session 自動載入。可以要求 Claude 記住特定事項：
```
> 請記住我的 git identity 用 cg 切換到 google 設定
```

### `/` slash 指令

| 指令 | 用途 |
|------|------|
| `/init` | 分析 codebase，產生 CLAUDE.md |
| `/clear` | 清空對話 context（保留 memory） |
| `/review` | review 當前 branch 的 PR |
| `/compact` | 手動壓縮 context，省 token |
| `/config` | 調整 model、theme 等設定 |
| `/cost` | 查看本次 session 的 token 用量 |

### 平行工具呼叫

Claude 在執行多個獨立任務時會自動並行呼叫工具（同時讀多個檔案、同時執行多個 grep），比 ChatGPT 類工具快很多，適合大型 codebase 的分析任務。

### 費用控制技巧

- 用 `/compact` 在 context 爆掉前主動壓縮，比等自動壓縮便宜
- `CLAUDE.md` 的內容會計入每次 context，不要放太多不必要的說明
- 看完一個獨立任務後用 `/clear` 再開始下一個，避免累積無關 context

### 搭配 screen / tmux 使用

WSL 裡用 `screen` 或 `tmux` 開多個視窗，一個跑 claude，其他視窗正常工作：
```bash
screen -S claude   # 開一個 screen session 跑 claude
# Ctrl+A D 分離，繼續其他工作
screen -r claude   # 回來繼續
```
</script>

# SW6100：QSSI vs Vendor 架構差異

## 本質定義

| | QSSI | Vendor |
|---|---|---|
| 定位 | Android Generic System Image（系統分區） | 完整 SW6100 vendor build tree |
| 目錄數 | 23,538 | 26,277 |
| 晶片相依性 | 無（跨 SoC 共用） | SW6100 / Aspen 平台專屬 |
| 包含關係 | 被 Vendor 完整包含 | QSSI 的超集 |

**原理：** Android Project Treble 要求 system 與 vendor 分區獨立更新。QSSI 是 Qualcomm 提供給 OEM 的參考系統映像，可跨多款 Snapdragon SoC 共用；Vendor tree 是晶片完整 build 所需的全部原始碼。

---

## Vendor 獨有的 Top-Level 目錄（6 個）

### 1. `kernel_platform/`
完整 kernel 原始碼，以 **Bazel + Kleaf** 構建：
- `bootable/bootloader/edk2` — UEFI/EDK2 bootloader
- `bootable/recovery/` — Android Recovery
- Bazel symlinks 指向 `bazel-cache/`（kernel build artifact 快取）

### 2. `non_hlos/`（最關鍵差異）
所有非 Linux OS 韌體子系統，共 20 個：

| 子目錄 | 用途 |
|--------|------|
| `modem_proc` | 蜂窩數據機韌體 |
| `adsp_proc` | 音訊 DSP（FastRPC、QNN AI 引擎、audio_fw） |
| `cdsp_proc` | 計算 DSP（Hexagon） |
| `btfw_proc` | 藍牙韌體 |
| `wlan_proc` | Wi-Fi 韌體 |
| `aop_proc` | Always-On Processor（低功耗狀態管理） |
| `cpucp_proc` | CPU Control Processor |
| `dcp_proc` | Display Co-Processor |
| `wm_proc` | Watch Mode 處理器 |
| `trustzone_images` / `tmel` / `qtee_tas` / `smc_themiso` | TrustZone / 安全飛地 |
| `boot_images` | 預建 bootloader 映像 |
| `LINUX` | DSP 上的嵌入式 Linux（FastRPC daemon 端） |
| `acpolicy`, `common`, `metadata`, `out`, `out_symbol` | AC policy、共用定義、build 產物 |

### 3. `layers/`
Yocto meta-layer：`meta-qti-audio` — AudioReach 音訊框架的嵌入式 Linux 食譜。

### 4. `meta-qti-display/`
Yocto 顯示 meta-layer，嵌入式 Linux 場景用。

### 5. `bazel-cache/`
`kernel_platform` Bazel 構建的 execroot 快取。

### 6. `shortcut-fe/`
網路封包 shortcut forwarding 驅動（硬體加速路由）。

---

## `vendor/qcom/opensource`（開源硬體驅動與 HAL）

| | QSSI | Vendor |
|---|---|---|
| 目錄數 | 7（平台中性） | 69（含晶片專屬） |

Vendor 多出的 62 個，按類型：

- **顯示**：`display`, `display-core`, `display-drivers`, `display-devicetree`, `display-intf`

## 可以單獨替換 boot.img 嗎？

**可以，但有條件。** SW6100 使用 GKI + DLKM 架構，boot.img 本身只含 GKI kernel，硬體驅動在獨立分區，天生支援單換。

### Boot 分區完整結構

```
[EDK2/XBL]    → xbl 分區        ← UEFI 第一階段 bootloader（non_hlos/boot_images/edk2）
      ↓
[ABL]          → abl 分區        ← vienna-kernel/kernel-abl，UEFI app 載入 Android
      ↓
[boot]         → boot.img        ← GKI kernel（你想換的）
[init_boot]    → init_boot.img   ← Android 13+ generic ramdisk + init（分離）
[vendor_boot]  → vendor_boot.img ← vendor ramdisk + 早期啟動 kernel modules
[dtbo]         → dtbo.img        ← Device Tree Overlay（vienna-kernel/kp-dtbs）
[vendor_dlkm]  → 硬體驅動模組   ← vienna-kernel/vendor_dlkm/
[system_dlkm]  → system 模組    ← vienna-kernel/system_dlkm/
```

`vendor_dlkm` / `system_dlkm` 在目錄樹中是獨立的 prebuilts 分區，**不在 boot.img 裡**。

### 何時可以單換

| 情境 | 結果 |
|------|------|
| 同 GKI 版本，只改 config / patch | ✅ vendor 模組 ABI 相容，正常啟動 |
| `fastboot boot boot.img`（RAM 啟動，不刷入） | ✅ 最安全的測試方式 |
| 跨 GKI 版本（如 5.15 → 6.1） | ❌ vendor_dlkm 模組無法載入 |
| 修改了 kernel 匯出符號（KMI break） | ❌ Wi-Fi、相機、modem 驅動失敗 |

### Modem / DSP 不受影響

`non_hlos/modem_proc`、`adsp_proc` 等韌體透過 **QMI over SMD/MHI** 與 AP 通訊，不依賴 boot.img。換 boot.img 不影響數據機韌體，除非動到相關 kernel driver（如 `qcom-Q6V5-pil`）的 API。

### 實際指令

```bash
# 測試（RAM 啟動一次，不刷入）
fastboot boot boot.img

# 正式刷入
fastboot flash boot boot.img

# 生產裝置需先解鎖 AVB
fastboot flashing unlock
# 或開發版關閉驗證
fastboot --disable-verification flash boot boot.img
```

---

## 只改 Device Tree 呢？

比換 boot.img 更輕量。SW6100 的 Device Tree 編譯後**不在 boot.img 裡**，分散在三個地方：

```
DTS 來源（多個 repo）                    編譯後落點
─────────────────────────────────────────────────────────────
kernel_platform/.../devicetree  ─┐
vendor/qcom/opensource/          │  → DTBs  → vendor_boot.img
  audio-devicetree               │             (不動 boot.img)
  bt-devicetree                  │
  display-devicetree             │
  camera-devicetree ...         ─┘

板級 overlay (SKU/variant)       ──→ DTBO  → dtbo 分區（獨立）

vienna-kernel/kp-dtbs            ──→ XBL/ABL 讀取，Linux 啟動前
                                      → abl / 相關 bootloader 分區
```

### 依改動範圍決定要刷哪個分區

| 改動類型 | 例子 | 需刷分區 |
|---------|------|---------|
| 板級 overlay（GPIO、regulator 電壓、某功能開關） | 改某個 SKU 的 pin config | `dtbo` 分區只 |
| SoC 核心 DT（新加 peripheral、clock、interrupt） | 加一顆 I2C 裝置 | `vendor_boot` |
| bootloader 平台 DT（kp-dtbs） | XBL 階段硬體初始化 | `abl` / bootloader 分區 |

**boot.img 完全不用動。non_hlos 韌體也不受影響。**

### 實際指令

```bash
# 只改 DTBO（最常見情況）
fastboot flash dtbo dtbo.img

# 改了 base DTB（在 vendor_boot 裡）
fastboot flash vendor_boot vendor_boot.img
```

### DTS 來源分散在多個 repo

Qualcomm 把 DT source 按子系統拆開（`audio-devicetree`、`bt-devicetree`、`display-devicetree`、`camera-devicetree` 等 vendor/qcom/opensource 下的各 repo），build 時才合併。改單一子系統的 DT，只需重 build 並 flash `vendor_boot` 或 `dtbo`，不影響其他分區。

---

## 如何單獨 build DTBO

SW6100 用 **Kleaf（Bazel）** 建構 kernel，DTBO 有獨立的 Bazel target，不需要 full kernel build。

### 查詢可用的 DTBO target

```bash
cd kernel_platform/

# 列出所有 dtbo 相關 target
tools/bazel query 'attr(name, ".*dtbo.*", //...)'

# 列出 msm-kernel 下所有 target
tools/bazel query '//msm-kernel:*'
```

基於 `out/msm-kernel-vienna-consolidate/` 的命名，target 格式通常是：

```bash
# 只 build dtbo
tools/bazel build //msm-kernel:vienna_consolidate_dtbo
# 或
tools/bazel build //msm-kernel:aspen_dtbo
```

### DTS 來源如何納入

`vendor/qcom/opensource/` 下各 `-devicetree` repo 的 `.dts` / `.dtsi` 透過 `kernel_platform/qcom/opensource/devicetree/` 的 Kleaf BUILD 規則被引用。改這些 repo 後重跑 Bazel target 即可重新編譯。

### Build 輸出位置

```
kernel_platform/out/msm-kernel-vienna-consolidate/dist/
├── dtbo.img        ← flash 用
├── dtbs/           ← base DTBs (for vendor_boot)
└── ...
```

### 完整流程

```bash
# 1. 修改 DTS
vim vendor/qcom/opensource/audio-devicetree/aspen-audio.dtsi

# 2. 只 build DTBO
cd kernel_platform/
tools/bazel build //msm-kernel:<vienna_dtbo_target>

# 3. Flash（不需動 boot.img 或 vendor_boot）
fastboot flash dtbo out/msm-kernel-vienna-consolidate/dist/dtbo.img
fastboot reboot
```

### 傳統 make 方式（非 Kleaf）

```bash
export ARCH=arm64
export CROSS_COMPILE=aarch64-linux-android-
make msm_defconfig
make dtbs
```

# LSLink AP Driver Guide 解讀

## 系統架構

AP/SoC 透過三條匯流排直接連接 **Main iCE40** FPGA，Main 再透過 **LSLink** 把請求轉發給 **Sub iCE40**：

```
AP/SoC              Main iCE40               Sub iCE40
────────────        ─────────────────        ─────────────────
CSR SPI ─────────→  CSR SPI slave   ───────→  CSR register file
Sensor I2C ──────→  I2C slave        ───────→  I2C master (sensor)
Camera I2C ──────→  I2C slave        ───────→  I2C master (camera)
OLED/Finger SPI ─→  SPI slave bridge ───────→  SPI master bridge
UART ────────────→  CSR SPI path     ───────→  UART TX/RX
Flash update ────→  Golden flash bridge ─────→  Golden flash bridge
```

---

## 兩種映像（Image）

| | Golden Image | Feature Image |
|---|---|---|
| 用途 | OTA 更新 / boot 管理 | 正常產品運作 |
| Main VERSION | `0xA1` | `0x13` |
| Sub VERSION | `0xA2` | `0x13` |
| Flash 存取 | 有（Main + Sub） | 無 |
| 功能介面 | 無 | Sensor/Camera I2C、OLED SPI、Finger SPI、UART、PDM、I2S |

驅動啟動時必須先讀 CSR register `0x00` 確認映像版本，再決定啟用哪些介面。

---

## AP SPI Transport

### 規格要求

| 項目 | 值 |
|------|-----|
| 時脈 | 目標 20 MHz，可接受 20–25 MHz |
| CS 操作 | 必須先載入 TX FIFO 再 assert CS |
| Readback dummy | 明確填 `0x00`，絕不能用隱式 `0xFF` |
| Main 回應等待 | ~40 µs |
| Sub 回應等待 | ~200 µs（需過 LSLink） |

### CMD Byte 格式

```
bit 7  target  0=Main, 1=Sub
bit 6  rw      0=write, 1=read
bit 5  stream  0=CSR register, 1=stream channel
bit 4  flash   (golden image + stream=1 時有效)
bit 3  burst   0=single-byte, 1=burst
bit 2:0        保留，填 0
```

### 主要命令

| 操作 | CMD | 限制 |
|------|-----|------|
| Main CSR write | `0x00` | |
| Main CSR read | `0x40` | 需兩次 transaction |
| Sub CSR write | `0x80` | |
| Sub CSR read | `0xC0` | 需兩次 transaction |
| UART TX byte | `0xA0` | Feature only |
| UART RX pop | `0xE0` | Feature only，兩次 transaction |
| Main flash write/burst | `0x30` / `0x38` | Golden only |
| Sub flash write/burst | `0xB0` / `0xB8` | Golden only |
| Main flash read/burst | `0x70` / `0x78` | Golden only |
| Sub flash read/burst | `0xF0` / `0xF8` | Golden only（Feature 的 `0xF0` 是 UART！） |

### 兩次 Transaction 讀取規則

CSR read、UART RX pop、flash FIFO pop 均需兩次 SPI transaction：

```c
uint8_t lslink_csr_read(uint8_t target, uint8_t addr)
{
    uint8_t cmd[3]   = {(target ? 0x80 : 0x00) | 0x40, addr, 0x00};
    uint8_t dummy[3] = {0x00, 0x00, 0x00};   // 必須明確填 0x00
    uint8_t rsp[3]   = {0};
    spi_txn(cmd, sizeof(cmd), NULL, 0);
    wait_us(target ? 200 : 40);
    spi_txn(dummy, sizeof(dummy), rsp, sizeof(rsp));
    return rsp[0];
}
```

---

## CSR Register Map

| 地址 | 名稱 | 說明 |
|------|------|------|
| `0x00` | VERSION | Main golden=`0xA1`，Sub golden=`0xA2`，feature=`0x13` |
| `0x01` | LINK_STATUS | bit 0 = LSLink up |
| `0x02` | GPIO_CTRL | **禁止當 scratch**，會改 HS_PWR_GATE |
| `0x03–0x05` | SCRATCH | 自由使用（self-test 用 `0x03`） |
| `0x06` | WARMBOOT | bit 7 = boot trigger，bit 1:0 = 目標 slot |
| `0x0C` | FINGER_STATUS | bit 0 = data ready，bit 1 = busy |
| `0x0E–0x0F` | CRC_ERR_L/H | LSLink CRC 錯誤計數，唯讀，飽和於 `0xFFFF` |

Sub VERSION 返回 `0xFF` 代表 LSLink 未就緒，不是有效版本值。

---

## Image 切換（Warmboot）

Multiboot 4 個 slot（0x000000 / 0x020000 / 0x040000 / 0x060000），warmboot sequence：

```c
void lslink_warmboot(uint8_t target, uint8_t slot)
{
    lslink_csr_write(target, 0x06, 0x00);
    lslink_csr_write(target, 0x06, slot & 0x03);
    lslink_csr_write(target, 0x06, 0x80 | (slot & 0x03));
}
```

**Golden → Feature（Main 先）：**
```c
lslink_warmboot(MAIN, 1);  wait_ms(3000);  spi_reinit();
wait_until(lslink_csr_read(MAIN, 0x00) == 0x13);
wait_until(lslink_csr_read(MAIN, 0x01) & 0x01);
lslink_warmboot(SUB, 1);   wait_ms(1000);
wait_until(lslink_csr_read(SUB,  0x00) == 0x13);
```

**Feature → Golden（Sub 先）：**
```c
lslink_warmboot(SUB,  0);  wait_ms(1000);
lslink_warmboot(MAIN, 0);  wait_ms(3000);  spi_reinit();
wait_until(lslink_csr_read(MAIN, 0x00) == 0xA1);
wait_until(lslink_csr_read(MAIN, 0x01) & 0x01);
wait_until(lslink_csr_read(SUB,  0x00) == 0xA2);
```

---

## Golden Flash Driver

Flash 規格：SPI NOR，JEDEC ID `20 BA 16`（4 MiB，256-byte page，4 KiB erase sector）。

### 關鍵規則

| 規則 | 說明 |
|------|------|
| Single-byte write | 用於 WREN、Sector Erase 等需要精確 CS deassert 的命令 |
| Burst write padding | 填 `0xFF`（`0x00` 會把 zero bit 寫進 flash！） |
| Burst 最大 payload | 62 bytes（64-byte frame 扣掉 2-byte CSR prefix） |
| Page program chunk | 每次 ≤ 32 bytes，不可跨越 256-byte page boundary |
| WREN | 每個 erase 和每個 page program chunk 前都必須 WREN |
| Burst readback 後 | 必須 wait 10 ms 讓 drain 完成才能發下一命令 |
| Flash FIFO | Main 和 Sub 各自獨立，讀哪個 target 就 drain 哪個 FIFO |

### 完整 Erase + Program 流程

```c
// 1. 初始化：drain FIFO + release from deep power-down
flash_drain_fifo(rcmd);
flash_send_byte(wcmd, 0xAB, true);   // Release from deep power-down (0xAB)
wait_ms(10);
flash_drain_fifo(rcmd);

// 2. 4 KiB sector erase
flash_send_byte(wcmd, 0x06, true);                    // WREN
flash_send_byte(wcmd, 0x20, false);                   // Sector Erase
flash_send_byte(wcmd, addr >> 16, false);
flash_send_byte(wcmd, addr >> 8,  false);
flash_send_byte(wcmd, addr,       true);
flash_wait_ready(bcmd, burst_rcmd);                   // poll WIP bit

// 3. Page program（≤32 bytes，不跨 256-byte boundary）
flash_send_byte(wcmd, 0x06, true);                    // WREN
// payload = [0x02][addr>>16][addr>>8][addr][data...]
flash_cmd_burst(bcmd, payload, 4 + len);
flash_wait_ready(bcmd, burst_rcmd);
```

Flash 單字節 remote pop 速率約 5 KB/s，burst read 在保守 10 ms guard 下也約 5 KB/s，只適合小量控制資料，不適合大量傳輸。

---

## Feature Image 介面

### Sensor / Camera I2C
- AP 看到的是 I2C slave on Main，Main 轉發給 Sub
- 必須停用 AP 的短 SCL timeout（或設 >10 ms），因為 bridge 會 stretch SCL
- 讀取要實作 retry（建議最多 4 次，間隔 2 ms）

### UART
- CMD `0xA0` TX，`0xE0` RX（兩次 transaction），115200 baud 8N1
- RX 返回 `0xFF` 表示 FIFO 空，不是錯誤

### OLED SPI3（Store-and-Forward）
- Unpacked：`[0x00][cmd]` / `[0x01][data]` byte pairs
- Packed：marker `0xFF` + 每 9 bytes 編碼 8 個 9-bit frame；不完整的最後一組會被 Sub 丟棄
- 高速 OLED 寫入用 packed format

### Finger SPI
- Store-and-forward，command/data 一次 transaction，response 之後另讀
- 啟動前確認 `FINGER_STATUS (0x0C)` bit 0 = data ready

### PDM / I2S
- 純硬體介面，無需 CSR enable sequence
- Feature image + LINK_STATUS[0]==1 時自動運行
- Link 斷掉會自動 reset/recover，AP 層需重新同步 audio stream

---

## 效能與 Timeout 預算

| 操作 | 預算 |
|------|------|
| CSR SPI wire | 0.4 µs/byte @ 20 MHz，64-byte frame ≈ 26 µs |
| Main CSR read | 等 ~40 µs，timeout ≥ 1 ms |
| Sub CSR read | 等 ~200 µs，timeout ≥ 1 ms |
| Link recovery / warmboot | 用秒級 timeout polling VERSION + LINK_STATUS |
| I2C bridge round trip | SCL stretch 200–400 µs；SCL timeout 應停用或 >10 ms |
| Page program chunk | timeout ~10 ms |
| 4 KiB sector erase | WIP polling，timeout ~500 ms |

---

## 常見失效模式

| 症狀 | 可能原因 | 處理方式 |
|------|---------|---------|
| Sub VERSION 讀到 `0xFF` | LSLink 未 up，無 remote 回應 | 先確認 LINK_STATUS[0]，retry 直到 timeout |
| CSR read 干擾 flash/UART | Readback 用了隱式 `0xFF` dummy | 所有 readback transaction 一律填明確 `0x00` |
| Main CSR 全返回 `0xFF` | AP SPI FIFO 空，CS 時序錯，FPGA 未配置 | 重新 init SPI，確認 CS 時序，讀 Main VERSION |
| Flash JEDEC 讀到 `FF FF FF` | Flash 未 wake up，命令 target 錯，link down | 執行 flash_prepare，確認命令前綴，查 LINK_STATUS |
| Flash erase/program 無效果 | 缺 WREN，跨 page boundary，flash 還在 busy | 每 chunk 前 WREN，256-byte boundary 切分，poll WIP |
| Flash 資料位移 | 舊 FIFO 資料，read 資料偏移量錯誤 | 命令前 drain FIFO，`0x03` read 有效資料從 offset 4 開始 |
| I2C 返回錯誤或全 `0xFF` | Bridge timeout，NACK，link 中斷 | retry transaction，查 LINK_STATUS 和 CRC delta |
| OLED packed 資料遺失 | 9-byte group 不完整，marker 錯 | 固定用 `0xFF` marker，每次送完整 8-frame group |
| CRC 計數增加 | Main 收到壞的 LSLink 封包 | 丟棄/重試當前命令視窗；記錄 baseline 再比 delta |

---

## Driver Checklist（摘要）

- CSR readback transaction TX 一律明確填 `0x00`
- Sub 操作前先確認 `LINK_STATUS[0]`；Sub VERSION == `0xFF` = 未就緒
- 依 VERSION 決定介面：Flash 只在 Golden，功能介面只在 Feature
- Flash burst padding 填 `0xFF`（非 `0x00`）
- Main/Sub flash FIFO 獨立，讀哪個 target drain 哪個
- Page program ≤32 bytes，不跨 256-byte page boundary，每 chunk WREN
- I2C 停用短 SCL timeout，讀取加 retry
- OLED packed：marker `0xFF`，送完整 9-byte group
- Warmboot 後必須 reinit AP SPI 並 poll VERSION
- Scratch 用 `0x03` 以上，禁用 `0x02`

---

# 實作：AWM lslink_service（2026-06-11）

依本指南在 SW6100 **AWM（Ambient Micro，Zephyr 協處理器）** 上實作了一個 G-Link 控制服務，並提供 Android(apss) 端可透過 adb 操作的 CLI。位置：`sw6100/drivers/wm_proc/productsw/lslink_service/`。詳見 note #23（wm_proc）的 IPC 段落。

## 端到端資料流

```
Android(apss)                                   AWM(Zephyr)
  lslink_cli ──write()/read()──► /dev/lslink_ctrl
                                   │ glink_pkt kernel driver
                                   └─ G-Link "LSLINK_CTRL" ─► lslink_service.c
                                                                 │ msgq → worker thread
                                                              lslink_core.c（協議引擎）
                                                                 │ lslink_hal_xfer()
                                                              lslink_hal_spi.c ─SPI─► Main iCE40 ─LSLink─► Sub iCE40
```

## 韌體端檔案分層（AWM）

| 檔案 | 對應本指南的部分 |
|------|----------------|
| `inc/lslink_proto.h` | CMD byte 位元定義、CSR register map、VERSION 碼、timing 預算（純常數轉錄） |
| `inc/lslink_msg.h` | **G-Link wire format**（host↔韌體共用）：packed req/rsp + opcode + status |
| `src/lslink_core.c` | 協議引擎：CSR write（單次）、**CSR read（兩次 transaction + 明確 `0x00` dummy）**、image 分類、warmboot、Golden↔Feature 有序切換序列 |
| `src/lslink_hal_spi.c` | SPI 綁定（`spi_full_duplex`，Mode0/CS-low/20 MHz）；**SPI 腳位 TBD 集中於此** |
| `src/lslink_service.c` | G-Link 服務：link/channel 生命週期、rx cb 不阻塞（丟 msgq）、worker thread 執行後 `glink_tx` 回應 |

關鍵設計：`image_switch` 會阻塞數秒（warmboot 3s+1s），所以 rx callback 只複製 request 進 message queue，由 worker thread 跑 SPI，符合 G-Link dispatch context 不可阻塞的要求。

## Host 端 CLI（apss / Android）

`host/lslink_cli.c` — **直接 include 韌體的 `lslink_msg.h`**，wire format 單一來源、兩端永不漂移。透過 kernel **glink_pkt** 驅動暴露的 `/dev/lslink_ctrl` 字元裝置 `open/write/poll/read`。

```sh
adb push lslink_cli /data/local/tmp/ && adb shell chmod 755 /data/local/tmp/lslink_cli

adb shell /data/local/tmp/lslink_cli version main     # VERSION = 0xA1 / 0x13
adb shell /data/local/tmp/lslink_cli linkup           # LSLink up = 1
adb shell /data/local/tmp/lslink_cli image            # GOLDEN / FEATURE
adb shell /data/local/tmp/lslink_cli read  sub  0x00  # 原始 CSR 讀
adb shell /data/local/tmp/lslink_cli write main 0x03 0xAB
adb shell /data/local/tmp/lslink_cli switch feature   # Golden→Feature（阻塞數秒）
```

CLI 命令：`ping / linkup / image / version / read / write / warmboot / switch`。數字吃 hex 或十進位；exit code 區分 OK / firmware-error / IO-error。`read`/`write` 為 raw CSR（bring-up 除錯用，仍須遵守上述地雷如 `0x02` 不可當 scratch）；`switch`/`warmboot` 已封裝指南規定的有序時序。

## 待定（與 schematic 連動）

- **SPI 腳位**：`CONFIG_LSLINK_SPI_*`（QUP / SE index / CS index）目前為 placeholder，定案後建議移進 AWM devicetree
- **multiboot slot 對應**：`image_switch` 暫設 slot0=Golden、slot1=Feature
- **kernel glink_pkt 節點**：edge 名稱（常見 `"awm"`）、`dev-name → /dev/lslink_ctrl`；channel name `LSLINK_CTRL` 兩端必須一致（kernel 實際比對的鍵）

# SW6100 wm_proc：Zephyr 永遠在線協處理器韌體

## 它是什麼

**WM_PROC = Wearable Module Processor** — SW6100（Vienna / Wear OS 智慧手錶平台）上的**低功耗永遠在線協處理器（always-on co-processor）韌體**。跑的是 **Zephyr RTOS**（不是 Linux），與 Android 主系統（QSSI + Vendor）是**兩個獨立的 processor**。

| 識別資訊 | 值 |
|---------|-----|
| Git branch | `SW6100.LAW.1.0-GZI3`（**LAW** = Low-power Always-on Wearable）|
| Image tree | `LPAI.WM.1.2`（**LPAI** = Low Power AI Island）|
| RTOS | Zephyr（整個 upstream Zephyr tree 約 35,840 檔）|
| 建構系統 | Qualcomm `build.qc.2.0` + CMake + West |
| Python | 3.12.10（image_info.json 指定）|

## 兩個 build variant

`image_info.json` 只暴露兩個整合目標：

| Variant | 含義 | 用途 |
|---------|------|------|
| `aspen.awm.law_prod` | **AWM** = Always-on Wearable Module | 永遠在線島，含 AI/感測融合 |
| `aspen.swm.prod` | **SWM** = Sensing Wearable Module | 純感測島 |

`aspen` 是此協處理器的 SoC/island codename。建構入口：`wm_proc/build/ms/build.sh <variant>` → `build_variant.py`。
（`config/` 下另有 glymur/balsam/kaanapali/molokai… 數十個其他平台 codename，但本 branch 只 build aspen。）

## 五大子系統

```
wm_proc/
├── zephyr/         Zephyr RTOS 核心 + Qualcomm corezephyr 擴充 (go/corezephyr)

│   ├── mproc/      多核 IPC：glink, smem, smp2p  ← 與 Android 主核通訊

│   │     ak0991x(磁), bmm350(磁), bmp5(氣壓),

│   ├── drivers/    QSH 服務：qsh_ble, qsh_wifi, qsh_wwan, qsh_modem,

├── qdl-drivers/    【顯示管線】DSI(面板,M55), dcp_mgr, hfi, wfd — 41 .c

## 與 Android 主系統的關係

```
┌─────────────────────────────┐         ┌──────────────────────────┐
│  Android (QSSI + Vendor)    │  glink  │  wm_proc (Zephyr)        │
│  跑在 AP 大核                │◄───────►│  always-on co-processor  │
│                             │ mproc/  │  低功耗島                 │

兩者透過 `core_ect/mproc/`（glink / smem / smp2p 共享記憶體 IPC）通訊。手錶熄屏時主核睡眠，由 wm_proc 持續處理感測與顯示 AOD — 這是 Wear OS 續航的關鍵。

# IPC 技術細節：core_ect/mproc

Qualcomm 跨核通訊是**三層堆疊**，三者分工明確：

```
   應用 / 服務層
        │  glink_open() / glink_tx() / notify_rx callback
┌───────▼────────────────────────────────────────────┐
│  G-Link  (邏輯通道層 / RPC-like)                     │
│  多工命名通道、流量控制(QoS)、RX intent、訊號線     │
│  glink/core/                                         │
├──────────────────────┬──────────────────────────────┤
│  xport_smem          │  SMP2P                        │
│  (資料搬運)           │  (中斷信號 / GPIO-like 狀態) │
│  glink/xport_smem/   │  smp2p/                       │
├──────────────────────▼──────────────────────────────┤
│  SMEM  (Shared Memory 配置 + spinlock)               │
│  smem/  — 跨核共享 RAM 的分割、配置、版本協商        │
└──────────────────────┬──────────────────────────────┘
                       │
              實體共享 RAM + 硬體中斷線
```

## 1. SMEM — Shared Memory（最底層）

跨核共用的一塊實體 RAM，所有上層 IPC 的資料都放這裡。

- **host 拓樸**：每個 processor 是一個 "host"，由 `core_ect/api/mproc/smem_type.h` 的 `smem_host_type` enum 定義（共 25 個）。本平台關鍵 host：

  | ID | enum | name | 角色 |
  |----|------|------|------|
  | 0 | `SMEM_APPS` | apss | **Android 主核**（你 build 的那個）|
  | 1 | `SMEM_MODEM` | mpss | 數據機 |
  | 2 | `SMEM_ADSP` | lpass | 音訊 DSP |
  | 23 | `SMEM_WM` | **swm** | Wear Micro（= `aspen.swm.prod` variant）|
  | 24 | `SMEM_AM` | **awm** | Ambient Micro（= `aspen.awm.law_prod` variant）|

  → **重要**：wm_proc 的兩個 variant 其實是**兩顆不同的微核**（SWM 感測核 + AWM 環境/顯示核），不只是兩種 build。本核身份由 devicetree `DT_PROP(.../smem, host)` 決定（`SMEM_THIS_HOST`）。

- **檔案**：
  - `smem/src/smem.c` — 核心 alloc / 分割管理
  - `smem/src/smem_partition.c` — per-host partition（每對 host 有獨立分割避免互踩）
  - `smem/src/spinlock.c` — 跨核硬體 spinlock（`SMEM_SPINLOCK_PID = THIS_HOST+1`）
  - `smem/src/smem_legacy.c` — 舊式非分割相容模式
  - `smem/inc/smem_toc.h` — Table of Contents（SMEM 頭部目錄）

## 2. SMP2P — Shared Memory Point to Point（信號層）

像「跨核的 GPIO」：一個 host 翻轉某個 bit → 對方收到中斷。用於通知「FIFO 有資料了」「子系統重啟了」等事件，**不搬資料**。

- 每條 edge 是一對 in/out entry，存在 SMEM 裡（`SMEM_ID_SMP2P_0 = 616`）；magic `0x504D5324`（"$SMP"），最多 1024 entries。
- 重啟握手：`SMP2P_FLAG_RESTART_DONE` / `_ACK`。
- **API**（`api/mproc/smp2p.h`）：`smp2p_create()` 建一條具名 entry → `smp2p_write()` 翻 bit 觸發中斷。`SMP2P_FLAGS_NO_INTR` 可只寫不中斷。
- **檔案**：`smp2p/src/smp2p.c`（核心）、`smp2p_events.c`（事件分派）、`smp2p_target.c`（中斷硬體繫結）。

## 3. G-Link — Generic Link（邏輯通道層）

上層真正使用的 API。在 SMEM transport 之上提供**多條命名雙向通道**，類似 socket。

- **連線模型**：`glink_open({ remote_ss:"apss", name:"<channel>", notify_rx:cb })` → 跟遠端某核的某具名通道建立連線。`remote_ss` 用上表的 name（"apss"/"lpass"…）。
- **核心機制**：
  - **RX intent** — 接收端預先宣告「我準備好收 N bytes」的緩衝（零拷貝流控），送端才能送。
  - **QoS** — `glink_qos.c` 優先權排程；transport 優先序 `GLINK_XPORT_SMEM=100`。
  - **訊號線** — `glink_sigs_set/get`（類似 UART 的 RTS/CTS 帶內信號）。
  - **intentless transport** — 小封包免 intent 的快速路徑。
- **檔案分層**：
  - `glink/core/src/glink_api.c` — 公開 API：`glink_open/close/tx/txv/queue_rx_intent/rx_done`
  - `glink/core/src/glink_core_*.c` — 狀態機、intent 管理、full/intentless transport
  - `glink/xport_smem/src/xport_smem.c` — **把 G-Link 接到 SMEM**：FIFO 環形緩衝讀寫
  - `glink/xport_smem/src/xport_smem_devcfg.c` — 從 devicetree 讀每條 edge（remote_host、fifo_size、irq）
  - `glink/ssr/src/glink_ssr.c` — **SSR（Subsystem Restart）**：某核 crash 重啟時，通知並重建所有通道
  - `glink/glink_loopback/` — 自我回環測試（per-variant：aspen_lpai_awm / aspen_lpai_swm）

## 各層 API 對應

| 層 | 公開 header | 核心入口 |
|----|------------|----------|
| G-Link | `api/mproc/glink.h` | `glink_open` / `glink_tx` |
| SMP2P | `api/mproc/smp2p.h` | `smp2p_create` / `smp2p_write` |
| SMEM | `api/mproc/smem.h` | `smem_alloc` |

## 與 Android 端的對應

Android（apss）端的對等實作就在你 build 的 vendor tree 裡 — kernel 的 `drivers/soc/qcom/` 下有 `smem.c`、`glink_*`、`smp2p`。兩端透過**同一塊 SMEM + 同一組硬體中斷線**對接：wm_proc 是 `SMEM_WM/SMEM_AM` host，Android 是 `SMEM_APPS` host，channel name 兩邊必須一致才能 `glink_open` 成功。

## 與既有知識的關聯

- 補上 SW6100 平台**第三塊拼圖**：QSSI（系統映像）、Vendor（vendor build）、**wm_proc（co-processor 韌體）**。
- `sensinghub/sensors/drivers/bmm350` 與本 repo 的 `bmm360/`（Android SEE sensor driver）是**同系列磁力計的不同 SEE 環境版本**：bmm360 跑在 Android SLPI，bmm350 跑在 Zephyr wm_proc。
